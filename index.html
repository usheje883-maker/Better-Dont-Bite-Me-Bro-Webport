  <body>
    <style>
        #loadingMessage {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #171717;
            color: white;
            font: 18px Arial, sans-serif;
            z-index: 9999;

</head>
<body>
    <div id="loadingMessage">Preparing game files...</div>
    <div class="webgl-content">
        <div id="gameContainer"></div>
    </div>

    <script>
        let gameInstance;

        async function loadParts(basePath, count) {
            const parts = [];
            let totalSize = 0;

            for (let i = 0; i < count; i++) {
                const suffix = String(i).padStart(3, "0");
                const url = basePath + ".part" + suffix;

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Could not load " + url);
                }

                const data = await response.arrayBuffer();
                parts.push(data);
                totalSize += data.byteLength;
            }

            const combined = new Uint8Array(totalSize);
            let offset = 0;

            for (const part of parts) {
                combined.set(new Uint8Array(part), offset);
                offset += part.byteLength;
            }

            return URL.createObjectURL(
                new Blob([combined], {
                    type: "application/octet-stream"
                })
            );
        }

        async function StartGame() {
            try {
                const buildPath = "Build/";

                const asmCode = await loadParts(
                    buildPath + "Bite me bro web.asm.code.unityweb",
                    3
                );

                const dataFile = await loadParts(
                    buildPath + "Bite me bro web.data.unityweb",
                    4
                );

                const wasmCode = await loadParts(
                    buildPath + "Bite me bro web.wasm.code.unityweb",
                    2
                );

                const jsonResponse = await fetch(
                    buildPath + "Bite me bro web.json?v=6"
                );

                if (!jsonResponse.ok) {
                    throw new Error("Could not load the Unity JSON file.");
                }

                const config = await jsonResponse.json();

                config.dataUrl = dataFile;
                config.asmCodeUrl = asmCode;
                config.wasmCodeUrl = wasmCode;

                const configBlob = URL.createObjectURL(
                    new Blob([JSON.stringify(config)], {
                        type: "application/json"
                    })
                );

                document.getElementById("loadingMessage").remove();

                gameInstance = UnityLoader.instantiate(
                    "gameContainer",
                    configBlob,
                    {
                        onProgress: UnityProgress
                    }
                );

                alert("Port By Noob_God2729");

                function Resize() {
                    if (
                        document.fullscreenElement ||
                        document.webkitFullscreenElement
                    ) return;

                    const container = document.getElementById("gameContainer");

                    if (
                        gameInstance &&
                        gameInstance.Module &&
                        gameInstance.Module.setCanvasSize
                    ) {
                        gameInstance.Module.setCanvasSize(
                            container.clientWidth,
                            container.clientHeight
                        );
                    }
                }

                function FullscreenChanged() {
                    if (
                        !document.fullscreenElement &&
                        !document.webkitFullscreenElement
                    ) {
                        Resize();
                    }
                }

                window.addEventListener("resize", Resize);
                document.addEventListener("fullscreenchange", FullscreenChanged);
                document.addEventListener("webkitfullscreenchange", FullscreenChanged);

            } catch (error) {
                const message = document.getElementById("loadingMessage");
                message.style.display = "flex";
                message.textContent = "Game loading failed: " + error.message;
                console.error(error);
            }
        }

        StartGame();
    </script>
</body>
